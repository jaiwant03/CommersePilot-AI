    <text x="40" y="90" fill="#111827" font-family="Inter, sans-serif" font-size="15" font-weight="700">We Missed You Today!</text>
    <text x="40" y="108" fill="#64748B" font-family="Inter, sans-serif" font-size="11.5">Choose your preferred re-attempt date and delivery notes:</text>

