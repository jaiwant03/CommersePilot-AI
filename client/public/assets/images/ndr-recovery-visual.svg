    <!-- Time slot selection -->
    <rect x="40" y="186" width="296" height="44" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="52" y="206" fill="#1E293B" font-family="Inter, sans-serif" font-size="12" font-weight="600">Preferred Time Slot: Afternoon</text>
    <text x="52" y="222" fill="#64748B" font-family="Inter, sans-serif" font-size="10.5">2:00 PM – 5:00 PM (Courier delivery agent assigned)</text>

    <!-- Address note -->
    <rect x="40" y="240" width="296" height="34" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="52" y="261" fill="#475569" font-family="Inter, sans-serif" font-size="11">Note: "Leave with security guard if not available"</text>

    <!-- Confirm Reschedule Button -->
    <rect x="40" y="286" width="296" height="42" rx="8" fill="#0284C7"/>
    <text x="188" y="312" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">✓ Confirm Rescheduled Delivery</text>
    
    <text x="188" y="348" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Instant courier webhook push to Delhivery dispatch system.</text>
  </g>
</svg>
