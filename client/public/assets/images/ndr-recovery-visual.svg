      <text x="45" y="22" fill="#4F46E5" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Tomorrow</text>
      <text x="45" y="38" fill="#4338CA" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Nov 25</text>

      <rect x="102" y="0" width="90" height="48" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="147" y="22" fill="#1E293B" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Wednesday</text>
      <text x="147" y="38" fill="#64748B" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Nov 26</text>

      <rect x="204" y="0" width="90" height="48" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="249" y="22" fill="#1E293B" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Thursday</text>
      <text x="249" y="38" fill="#64748B" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Nov 27</text>
