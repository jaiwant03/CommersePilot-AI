    <g transform="translate(24, 316)">
      <rect width="312" height="56" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="16" y="24" fill="#4F46E5" font-family="Inter, sans-serif" font-size="12" font-weight="700">RTO Prevented: ₹8,999 Order Saved</text>
      <text x="16" y="42" fill="#64748B" font-family="Inter, sans-serif" font-size="11">Saved two-way reverse logistics courier penalty of ₹320</text>
    </g>
