      <rect width="312" height="66" rx="8" fill="#EEF2FF" stroke="#C7D2FE"/>
      <text x="16" y="26" fill="#3730A3" font-family="Inter, sans-serif" font-size="12" font-weight="700">Autonomous Action Executed:</text>
