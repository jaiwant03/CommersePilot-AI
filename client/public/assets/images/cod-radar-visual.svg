<svg width="800" height="520" viewBox="0 0 800 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Card Background with soft shadow -->
  <rect width="800" height="520" rx="16" fill="#F8FAFC"/>
  <rect x="1" y="1" width="798" height="518" rx="15" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Header Bar -->
  <rect x="24" y="24" width="752" height="64" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <circle cx="56" cy="56" r="16" fill="#EEF2FF"/>
  <path d="M50 56L54 60L62 52" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="84" y="52" fill="#111827" font-family="Inter, sans-serif" font-size="15" font-weight="700">Cash-on-Delivery Risk Radar &amp; Pre-Dispatch Guard</text>
  <text x="84" y="70" fill="#64748B" font-family="Inter, sans-serif" font-size="12">Order #ORD-8921 • Ananya Deshmukh • Mumbai, MH (400050)</text>
