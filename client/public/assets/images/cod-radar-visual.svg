    <rect x="24" y="60" width="328" height="308" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="40" y="78" width="110" height="20" rx="4" fill="#EEF2FF"/>
    <text x="95" y="92" fill="#4F46E5" font-family="Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle">CHIC COUTURE</text>
    
    <text x="40" y="124" fill="#111827" font-family="Inter, sans-serif" font-size="15" font-weight="700">Please Confirm Your Order</text>
    <text x="40" y="146" fill="#475569" font-family="Inter, sans-serif" font-size="11.5">Hi Ananya, please verify your COD order before our warehouse packs your parcel.</text>

    <!-- Order Item Preview -->
    <rect x="40" y="166" width="296" height="52" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="48" y="174" width="36" height="36" rx="4" fill="#E0E7FF"/>
    <text x="94" y="190" fill="#1E293B" font-family="Inter, sans-serif" font-size="12" font-weight="600">Pure Kanjivaram Silk Saree</text>
    <text x="94" y="204" fill="#64748B" font-family="Inter, sans-serif" font-size="11">Qty: 1 • COD Total: ₹8,999</text>

    <!-- 1-Click Verification Button -->
    <rect x="40" y="234" width="296" height="42" rx="8" fill="#4F46E5"/>
    <text x="188" y="260" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">✓ Confirm Cash-on-Delivery Order</text>
    
    <text x="188" y="296" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Single-use encrypted verification link. No login required.</text>
    
    <rect x="40" y="314" width="296" height="34" rx="6" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="188" y="335" fill="#065F46" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">⚡ Verified orders enter same-day express dispatch</text>
