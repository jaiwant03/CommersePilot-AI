  <text x="705" y="61" fill="#D97706" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">FLAGGED: REVIEW</text>

  <!-- Left Column: Risk Factor Decomposition -->
  <g transform="translate(24, 104)">
    <rect width="360" height="392" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="24" y="36" fill="#111827" font-family="Inter, sans-serif" font-size="14" font-weight="700">Deterministic RTO Risk Analysis</text>
    <text x="24" y="54" fill="#64748B" font-family="Inter, sans-serif" font-size="12">Algorithmic evaluation score: 45 / 100</text>
    
    <!-- Score Gauge -->
    <rect x="24" y="72" width="312" height="10" rx="5" fill="#F1F5F9"/>
    <rect x="24" y="72" width="140" height="10" rx="5" fill="#F59E0B"/>
    
    <!-- Rule 1 -->
    <g transform="translate(24, 106)">
      <rect width="312" height="54" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <circle cx="24" cy="27" r="10" fill="#DCFCE7"/>
      <path d="M20 27L23 30L28 24" stroke="#16A34A" stroke-width="2" stroke-linecap="round"/>
      <text x="44" y="24" fill="#1E293B" font-family="Inter, sans-serif" font-size="12" font-weight="600">Valid Phone Number &amp; WhatsApp</text>
      <text x="44" y="40" fill="#64748B" font-family="Inter, sans-serif" font-size="11">Active carrier signal detected (+91 98201...)</text>
      <text x="296" y="32" fill="#16A34A" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="end">+20 pts</text>
    </g>

    <!-- Rule 2 -->
    <g transform="translate(24, 172)">
      <rect width="312" height="54" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <circle cx="24" cy="27" r="10" fill="#FEF3C7"/>
      <path d="M24 22V27M24 31H24.01" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>
      <text x="44" y="24" fill="#1E293B" font-family="Inter, sans-serif" font-size="12" font-weight="600">Address Completeness Check</text>
      <text x="44" y="40" fill="#64748B" font-family="Inter, sans-serif" font-size="11">Landmark missing in street address</text>
      <text x="296" y="32" fill="#D97706" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="end">-15 pts</text>
    </g>

    <!-- Rule 3 -->
    <g transform="translate(24, 238)">
      <rect width="312" height="54" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <circle cx="24" cy="27" r="10" fill="#EEF2FF"/>
      <path d="M20 27L28 27" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
      <text x="44" y="24" fill="#1E293B" font-family="Inter, sans-serif" font-size="12" font-weight="600">Courier Pincode Historical Deliverability</text>
      <text x="44" y="40" fill="#64748B" font-family="Inter, sans-serif" font-size="11">400050 has 94.2% delivery success</text>
      <text x="296" y="32" fill="#4F46E5" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="end">+15 pts</text>
    </g>

    <!-- Action Taken -->
