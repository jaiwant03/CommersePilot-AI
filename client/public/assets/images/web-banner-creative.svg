<svg width="360" height="540" viewBox="0 0 360 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="warmAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="35%" stop-color="#D97706"/>
      <stop offset="70%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <radialGradient id="sunSpot" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#FDE68A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dropperLiquid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Outer Card Frame -->
  <rect width="360" height="540" rx="20" fill="#0D1117"/>
  <rect x="1" y="1" width="358" height="538" rx="19" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

  <!-- Top Window Chrome: WEB BANNER -->
  <rect x="0" y="0" width="360" height="34" rx="20" fill="#161B22"/>
  <rect x="0" y="20" width="360" height="14" fill="#161B22"/>
  <text x="16" y="22" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="0.08em">WEB BANNER</text>
  <circle cx="330" cy="18" r="3" fill="#484F58"/>
  <circle cx="342" cy="18" r="3" fill="#484F58"/>

  <!-- Banner Creative Area (Warm Golden Luxury Cosmetic Visual) -->
  <g transform="translate(0, 34)">
    <rect width="360" height="416" fill="url(#warmAmber)"/>
    <rect width="360" height="416" fill="url(#sunSpot)"/>

    <!-- Subtle Abstract Geometry -->
    <circle cx="280" cy="120" r="140" fill="#FDE68A" fill-opacity="0.12"/>
    <circle cx="80" cy="300" r="160" fill="#78350F" fill-opacity="0.25"/>

    <!-- Dropper Pipette Releasing Pure Golden Serum Drop -->
    <g transform="translate(180, 260)">
      <!-- Dropper Glass Tip -->
      <path d="M-10 -70 L10 -70 L4 -10 L-4 -10 Z" fill="#FFFFFF" fill-opacity="0.6" stroke="rgba(255,255,255,0.8)" stroke-width="1"/>
      <path d="M-6 -65 L6 -65 L2 -10 L-2 -10 Z" fill="url(#dropperLiquid)"/>
      
      <!-- Liquid Droplet Forming at Tip -->
      <path d="M0 -8 C6 -8, 12 4, 12 12 C12 20, -12 20, -12 12 C-12 4, -6 -8, 0 -8 Z" fill="url(#dropperLiquid)"/>
      <ellipse cx="-3" cy="8" rx="3" ry="6" fill="#FFFFFF" fill-opacity="0.7"/>

      <!-- Falling Golden Droplet -->
      <path d="M0 45 C4 45, 9 54, 9 60 C9 66, -9 66, -9 60 C-9 54, -4 45, 0 45 Z" fill="url(#dropperLiquid)"/>
      <ellipse cx="-2" cy="56" rx="2" ry="4" fill="#FFFFFF" fill-opacity="0.75"/>
    </g>

    <!-- Large Bold Overlay Typography -->
    <text x="24" y="90" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="38" font-weight="900" letter-spacing="-0.03em" line-height="0.95">
      GLOW IN
    </text>
    <text x="24" y="132" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="38" font-weight="900" letter-spacing="-0.03em">
      2 WEEKS
    </text>

    <!-- Inspection Bounding Box (Matching Image 4 UI) -->
    <rect x="20" y="52" width="180" height="90" rx="4" fill="none" stroke="#F43F5E" stroke-width="1.8" stroke-dasharray="4 3"/>
    
    <!-- Floating Inspector Tag Card -->
    <g transform="translate(205, 52)">
      <rect width="135" height="48" rx="8" fill="#1C1917" fill-opacity="0.92" stroke="rgba(244, 63, 94, 0.4)"/>
      <text x="10" y="18" fill="#FCA5A5" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">SHOPIFY FLASH SALE</text>
      <text x="10" y="32" fill="#D6D3D1" font-family="Inter, sans-serif" font-size="9.5">Demand: +340% Spike</text>
      <text x="10" y="43" fill="#38BDF8" font-family="Inter, sans-serif" font-size="8.5">Auto-PO Queued</text>
    </g>

    <!-- Product Sub-Text -->
    <text x="24" y="170" fill="#FEF3C7" font-family="Inter, sans-serif" font-size="12" font-weight="500">
      Festive Launch • 20% Off All Skincare Bundles
    </text>

    <!-- CTA Button on Banner -->
    <rect x="24" y="190" width="130" height="34" rx="17" fill="#0F172A"/>
    <text x="89" y="212" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">SHOP NOW →</text>
  </g>

  <!-- Bottom Operational Detection Banner (CommercePilot AI) -->
  <g transform="translate(0, 450)">
    <rect width="360" height="90" fill="#0D1117"/>
    <rect x="0" y="0" width="360" height="1" fill="#21262D"/>
    
    <polygon points="18,22 22,18 26,22 22,26" fill="#F43F5E"/>
    <text x="32" y="24" fill="#FDA4AF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="0.04em">
      DEMAND VELOCITY: 3.2 DAYS RUNWAY LEFT
    </text>
    <text x="18" y="44" fill="#8B949E" font-family="Inter, sans-serif" font-size="10.5">
      Shopify flash sale velocity spurt detected. Automated
    </text>
    <text x="18" y="60" fill="#8B949E" font-family="Inter, sans-serif" font-size="10.5">
      Supplier PO #PO-CHI-2014 drafted for restock.
    </text>
    <rect x="242" y="65" width="102" height="18" rx="9" fill="#161B22" stroke="#30363D"/>
    <text x="293" y="78" fill="#4ADE80" font-family="Inter, sans-serif" font-size="9" font-weight="600" text-anchor="middle">✓ STOCK PROTECTED</text>
  </g>
</svg>
