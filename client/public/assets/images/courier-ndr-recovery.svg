<svg width="360" height="540" viewBox="0 0 360 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Courier Header Gradient -->
    <linearGradient id="courierGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="100%" stop-color="#FFE4E6"/>
    </linearGradient>
    <linearGradient id="statusPillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Outer Card Frame -->
  <rect width="360" height="540" rx="20" fill="#0D1117"/>
  <rect x="1" y="1" width="358" height="538" rx="19" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

  <!-- Top Window Chrome: COURIER NDR RADAR -->
  <rect x="0" y="0" width="360" height="34" rx="20" fill="#161B22"/>
  <rect x="0" y="20" width="360" height="14" fill="#161B22"/>
  <text x="16" y="22" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="0.08em">COURIER NDR RADAR</text>
  <circle cx="330" cy="18" r="3" fill="#484F58"/>
  <circle cx="342" cy="18" r="3" fill="#484F58"/>

  <!-- Courier Service Header -->
  <rect x="0" y="34" width="360" height="54" fill="url(#courierGrad)"/>
  <!-- Delhivery / Shiprocket Logo Badge -->
  <rect x="16" y="44" width="34" height="34" rx="8" fill="#E11D48"/>
  <text x="33" y="66" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="16" font-weight="900" text-anchor="middle">D</text>
  <text x="60" y="56" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="13" font-weight="700">Delhivery Express</text>
  <text x="60" y="71" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10.5">AWB: #DL9841204IN</text>
  
  <rect x="250" y="49" width="94" height="24" rx="12" fill="rgba(239, 68, 68, 0.2)" stroke="#EF4444" stroke-width="1"/>
  <text x="297" y="65" fill="#FCA5A5" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">NDR FLAGGED</text>

  <!-- Body Content -->
  <g transform="translate(0, 88)">
    <rect width="360" height="374" fill="#F8FAFC"/>
    
    <!-- Exception Alert Banner -->
    <g transform="translate(16, 14)">
      <rect width="328" height="66" rx="12" fill="url(#alertGrad)" stroke="#FECDD3" stroke-width="1"/>
      <circle cx="28" cy="33" r="12" fill="#F43F5E"/>
      <text x="28" y="38" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="12" font-weight="900" text-anchor="middle">!</text>
      <text x="50" y="28" fill="#9F1239" font-family="Inter, sans-serif" font-size="11.5" font-weight="700">Delivery Exception: Customer Unavailable</text>
      <text x="50" y="44" fill="#E11D48" font-family="Inter, sans-serif" font-size="10.5">Attempt 1 at Powai Hiranandani Hub • 11:14 AM</text>
      <text x="50" y="58" fill="#881337" font-family="Inter, sans-serif" font-size="10" font-weight="600">Risk: Return to Origin (RTO) in 24 hours</text>
    </g>

    <!-- Sub-60s Automated Autonomous Intercept Timeline -->
    <g transform="translate(16, 92)">
      <rect width="328" height="184" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.04))"/>
      
      <text x="14" y="24" fill="#0F172A" font-family="Inter, sans-serif" font-size="11.5" font-weight="800">Autonomous Intercept &amp; Recovery</text>
      
      <!-- Event 1 -->
      <circle cx="24" cy="52" r="5" fill="#EF4444"/>
      <line x1="24" y1="57" x2="24" y2="85" stroke="#CBD5E1" stroke-width="2"/>
      <text x="38" y="50" fill="#0F172A" font-family="Inter, sans-serif" font-size="11" font-weight="600">11:14:02 AM - Courier NDR Webhook Ingested</text>
      <text x="38" y="63" fill="#64748B" font-family="Inter, sans-serif" font-size="9.5">Processed via CommercePilot AI in 420ms</text>

      <!-- Event 2 -->
      <circle cx="24" cy="90" r="5" fill="#3B82F6"/>
      <line x1="24" y1="95" x2="24" y2="123" stroke="#CBD5E1" stroke-width="2"/>
      <text x="38" y="88" fill="#0F172A" font-family="Inter, sans-serif" font-size="11" font-weight="600">11:14:48 AM - Smart Re-engagement Sent</text>
      <text x="38" y="101" fill="#64748B" font-family="Inter, sans-serif" font-size="9.5">Interactive 1-click slot picker sent via SMS &amp; Email</text>

      <!-- Event 3 -->
      <circle cx="24" cy="128" r="5" fill="#10B981"/>
      <text x="38" y="126" fill="#059669" font-family="Inter, sans-serif" font-size="11" font-weight="700">11:16:10 AM - Slot Confirmed by Customer</text>
      <text x="38" y="139" fill="#047857" font-family="Inter, sans-serif" font-size="9.5">"Please deliver tomorrow between 2-4 PM"</text>

      <!-- Verified Success Pill -->
      <rect x="14" y="150" width="300" height="24" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
      <text x="164" y="166" fill="#15803D" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">✓ Re-attempt Registered with Courier API</text>
    </g>

    <!-- Financial Impact Card -->
    <g transform="translate(16, 288)">
      <rect width="328" height="74" rx="10" fill="#0F172A"/>
      <text x="16" y="24" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10.5" font-weight="600">RECOVERY ECONOMICS</text>
      
      <text x="16" y="46" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="15" font-weight="800">₹1,840 Order Rescued</text>
      <text x="16" y="62" fill="#38BDF8" font-family="Inter, sans-serif" font-size="10.5">Avoided ₹240 reverse shipping + packaging waste</text>
      
      <rect x="236" y="18" width="76" height="38" rx="8" fill="#1E293B"/>
      <text x="274" y="34" fill="#10B981" font-family="Inter, sans-serif" font-size="13" font-weight="800" text-anchor="middle">91.4%</text>
      <text x="274" y="48" fill="#94A3B8" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">NDR WIN RATE</text>
    </g>
  </g>

  <!-- Bottom Operational Diagnosis Pill Bar (Matching Image 4 Style) -->
  <g transform="translate(0, 462)">
    <rect width="360" height="78" fill="#0D1117"/>
    <rect x="0" y="0" width="360" height="1" fill="rgba(255, 255, 255, 0.08)"/>
    <circle cx="20" cy="22" r="4" fill="#38BDF8"/>
    <text x="32" y="26" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">SUB-60s NDR RECOVERY</text>
    <text x="16" y="44" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="11" font-weight="600">
      RTO averted via automated customer re-scheduling.
    </text>
    <text x="16" y="62" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10.5">
      Courier notified with new delivery instructions before return transit.
    </text>
  </g>
</svg>
