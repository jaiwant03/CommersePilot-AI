<svg width="360" height="540" viewBox="0 0 360 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Velvet Jewelry Background -->
    <linearGradient id="velvetBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="45%" stop-color="#1E293B"/>
      <stop offset="80%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="sparkleGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="emeraldCut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="35%" stop-color="#34D399"/>
      <stop offset="70%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="platinumChain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>

  <!-- Outer Card Frame -->
  <rect width="360" height="540" rx="20" fill="#0D1117"/>
  <rect x="1" y="1" width="358" height="538" rx="19" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

  <!-- Top Window Chrome: SHOPIFY CATALOG -->
  <rect x="0" y="0" width="360" height="34" rx="20" fill="#161B22"/>
  <rect x="0" y="20" width="360" height="14" fill="#161B22"/>
  <text x="16" y="22" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="0.08em">SHOPIFY CATALOG</text>
  <circle cx="330" cy="18" r="3" fill="#484F58"/>
  <circle cx="342" cy="18" r="3" fill="#484F58"/>

  <!-- Shopify Catalog Item Card Header -->
  <rect x="0" y="34" width="360" height="48" fill="#FFFFFF"/>
  <rect x="16" y="44" width="28" height="28" rx="6" fill="#95BF47"/>
  <text x="30" y="63" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="13" font-weight="900" text-anchor="middle">S</text>
  <text x="52" y="54" fill="#0F172A" font-family="Inter, sans-serif" font-size="12" font-weight="700">Chic Couture Fine Jewels</text>
  <text x="52" y="68" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">SKU: #CC-EMR-884 • Live Sync</text>
  <rect x="265" y="48" width="79" height="20" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
  <text x="304" y="62" fill="#059669" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">LIVE SYNCED</text>

  <!-- Luxury Product Visual: Emerald & Diamond Pendant on Midnight Velvet -->
  <g transform="translate(0, 82)">
    <rect width="360" height="236" fill="url(#velvetBg)"/>
    <rect width="360" height="236" fill="url(#sparkleGlow)"/>

    <!-- Platinum Chain Loops -->
    <path d="M80 0 Q 180 130 180 140 Q 180 130 280 0" stroke="url(#platinumChain)" stroke-width="2.5" fill="none" opacity="0.85"/>
    <path d="M85 0 Q 180 135 180 142 Q 180 135 275 0" stroke="rgba(255,255,255,0.4)" stroke-width="1" fill="none"/>

    <!-- Pendant Shadow -->
    <ellipse cx="180" cy="180" rx="46" ry="16" fill="rgba(0, 0, 0, 0.7)"/>

    <!-- Platinum Prong Setting -->
    <rect x="145" y="125" width="70" height="84" rx="14" fill="#E2E8F0" stroke="#FFFFFF" stroke-width="1.5" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.5))"/>

    <!-- Radiant Emerald Gemstone -->
    <rect x="151" y="131" width="58" height="72" rx="10" fill="url(#emeraldCut)"/>
    
    <!-- Gemstone Facets & Sparkle Reflection -->
    <polygon points="151,131 165,145 195,145 209,131" fill="#6EE7B7" opacity="0.6"/>
    <polygon points="151,203 165,189 195,189 209,203" fill="#047857" opacity="0.7"/>
    <polygon points="151,131 165,145 165,189 151,203" fill="#10B981" opacity="0.5"/>
    <polygon points="209,131 195,145 195,189 209,203" fill="#065F46" opacity="0.8"/>
    
    <!-- Brilliant Center Sparkle Star -->
    <path d="M 180 152 L 182 158 L 188 160 L 182 162 L 180 168 L 178 162 L 172 160 L 178 158 Z" fill="#FFFFFF"/>
    <circle cx="180" cy="160" r="1.5" fill="#FFFFFF"/>

    <!-- Product Title & Price Overlay Banner inside Visual -->
    <g transform="translate(16, 178)">
      <rect width="180" height="46" rx="8" fill="#000000" fill-opacity="0.65" backdrop-filter="blur(8px)"/>
      <text x="12" y="20" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="12" font-weight="800">Emerald Solitaire Pendant</text>
      <text x="12" y="36" fill="#38BDF8" font-family="Inter, sans-serif" font-size="13" font-weight="800">₹34,500 <span style="font-size: 10px; color: #94A3B8; font-weight: 400;">(Prepaid Only)</span></text>
    </g>
  </g>

  <!-- Live Multi-Store Allocation Matrix -->
  <g transform="translate(0, 318)">
    <rect width="360" height="144" fill="#FFFFFF"/>
    
    <text x="16" y="22" fill="#0F172A" font-family="Inter, sans-serif" font-size="11" font-weight="700">MULTI-CHANNEL STOCK RESERVATION</text>
    <text x="344" y="22" fill="#0284C7" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" text-anchor="end">TOTAL: 7 UNITS</text>

    <!-- Channels Grid -->
    <g transform="translate(16, 32)">
      <!-- Channel 1: Shopify -->
      <rect x="0" y="0" width="102" height="54" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="10" y="18" fill="#64748B" font-family="Inter, sans-serif" font-size="10" font-weight="600">Shopify Web</text>
      <text x="10" y="38" fill="#0F172A" font-family="Inter, sans-serif" font-size="15" font-weight="800">4 <span style="font-size: 10px; color: #10B981;">Available</span></text>

      <!-- Channel 2: Instagram Live -->
      <rect x="112" y="0" width="102" height="54" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="122" y="18" fill="#64748B" font-family="Inter, sans-serif" font-size="10" font-weight="600">Instagram</text>
      <text x="122" y="38" fill="#0F172A" font-family="Inter, sans-serif" font-size="15" font-weight="800">2 <span style="font-size: 10px; color: #3B82F6;">Reserved</span></text>

      <!-- Channel 3: WhatsApp VIP -->
      <rect x="224" y="0" width="104" height="54" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="234" y="18" fill="#64748B" font-family="Inter, sans-serif" font-size="10" font-weight="600">Safety Buffer</text>
      <text x="234" y="38" fill="#0F172A" font-family="Inter, sans-serif" font-size="15" font-weight="800">1 <span style="font-size: 10px; color: #8B5CF6;">Locked</span></text>
    </g>

    <!-- Automated Buffer Lock Bar -->
    <g transform="translate(16, 96)">
      <rect width="328" height="34" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
      <circle cx="26" cy="17" r="4" fill="#0284C7"/>
      <text x="38" y="21" fill="#1E40AF" font-family="Inter, sans-serif" font-size="10.5" font-weight="600">
        Buffer Lock Active: Impossible to double-sell during live broadcast.
      </text>
    </g>
  </g>

  <!-- Bottom Operational Diagnosis Pill Bar (Matching Image 4 Style) -->
  <g transform="translate(0, 462)">
    <rect width="360" height="78" fill="#0D1117"/>
    <rect x="0" y="0" width="360" height="1" fill="rgba(255, 255, 255, 0.08)"/>
    <circle cx="20" cy="22" r="4" fill="#10B981"/>
    <text x="32" y="26" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">MULTI-STORE BUFFER LOCK</text>
    <text x="16" y="44" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="11" font-weight="600">
      Real-time cross-channel inventory locking active.
    </text>
    <text x="16" y="62" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10.5">
      Zero stockouts or unfulfillable orders across all storefronts.
    </text>
  </g>
</svg>
