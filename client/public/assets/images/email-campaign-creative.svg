<svg width="360" height="540" viewBox="0 0 360 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="linenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="50%" stop-color="#F7F1E7"/>
      <stop offset="100%" stop-color="#EFE6D6"/>
    </linearGradient>
    <linearGradient id="goldenOil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="60%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="creamTexture" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FFFDF5"/>
      <stop offset="100%" stop-color="#F5ECE0"/>
    </linearGradient>
    <linearGradient id="leafGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5A27"/>
      <stop offset="100%" stop-color="#143410"/>
    </linearGradient>
  </defs>

  <!-- Outer Card Frame -->
  <rect width="360" height="540" rx="20" fill="#0D1117"/>
  <rect x="1" y="1" width="358" height="538" rx="19" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

  <!-- Top Window Chrome: EMAIL -->
  <rect x="0" y="0" width="360" height="34" rx="20" fill="#161B22"/>
  <rect x="0" y="20" width="360" height="14" fill="#161B22"/>
  <text x="16" y="22" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="0.08em">EMAIL</text>
  <circle cx="330" cy="18" r="3" fill="#484F58"/>
  <circle cx="342" cy="18" r="3" fill="#484F58"/>

  <!-- Email Header Metadata -->
  <rect x="0" y="34" width="360" height="48" fill="#FFFFFF"/>
  <text x="16" y="52" fill="#64748B" font-family="Inter, sans-serif" font-size="10.5">From <strong style="fill: #0F172A;">Aurelle Skin Official</strong></text>
  <text x="16" y="68" fill="#64748B" font-family="Inter, sans-serif" font-size="10.5">Subject <strong style="fill: #0F172A;">Something big is coming... ✨</strong></text>
  <line x1="0" y1="82" x2="360" y2="82" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Email Visual Flatlay: Ceramic dishes with botanical leaves & golden oil textures -->
  <g transform="translate(0, 82)">
    <rect width="360" height="230" fill="url(#linenBg)"/>
    
    <!-- Botanical Leaf Shadows -->
    <path d="M290 20 Q 330 60, 360 120" stroke="rgba(45, 90, 39, 0.12)" stroke-width="20" stroke-linecap="round" fill="none"/>
    <path d="M300 130 Q 340 180, 360 210" stroke="rgba(45, 90, 39, 0.12)" stroke-width="14" stroke-linecap="round" fill="none"/>

    <!-- Botanical Green Leaves (Real Plant Accents matching Image 4) -->
    <path d="M295 10 C 330 30, 350 80, 360 110 C 340 100, 310 70, 295 10 Z" fill="url(#leafGreen)"/>
    <path d="M305 130 C 335 150, 355 180, 360 210 C 345 195, 325 175, 305 130 Z" fill="url(#leafGreen)"/>

    <!-- Ceramic Dish 1: Golden Radiance Oil with Bubble Drops -->
    <g transform="translate(85, 115)">
      <circle cx="0" cy="0" r="48" fill="#E8DCCB" opacity="0.4"/>
      <circle cx="0" cy="0" r="44" fill="#FFFFFF" stroke="#E2D6C3" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="38" fill="url(#goldenOil)"/>
      <!-- Liquid Highlights and Caustics -->
      <ellipse cx="-10" cy="-12" rx="14" ry="8" fill="#FEF08A" opacity="0.6"/>
      <circle cx="12" cy="10" r="5" fill="#FEF9C3" opacity="0.8"/>
      <circle cx="18" cy="-5" r="3" fill="#FFFFFF" opacity="0.75"/>
    </g>

    <!-- Ceramic Dish 2: Rich Velvet Emollient Cream Swirl -->
    <g transform="translate(195, 115)">
      <circle cx="0" cy="0" r="38" fill="#E8DCCB" opacity="0.4"/>
      <circle cx="0" cy="0" r="34" fill="#FFFFFF" stroke="#E2D6C3" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="28" fill="url(#creamTexture)"/>
      <!-- Cream Swirl Texture -->
      <path d="M -12 -10 Q 0 8, 14 -4 Q 8 16, -6 12 Z" fill="#FDFBF7" stroke="#EFE4D6" stroke-width="1.2"/>
      <ellipse cx="6" cy="-8" rx="6" ry="12" fill="#FFFFFF" opacity="0.8"/>
    </g>
  </g>

  <!-- Email Promotion Copy & CTA -->
  <g transform="translate(0, 312)">
    <rect width="360" height="138" fill="#FFFFFF"/>
    
    <!-- Decorative Pink Wavy Line (Matching Image 4) -->
    <path d="M 24 22 Q 28 17, 32 22 T 40 22 T 48 22 T 56 22 T 64 22 T 72 22 T 80 22 T 88 22 T 96 22 T 104 22 T 112 22 T 120 22 T 128 22 T 136 22 T 144 22 T 152 22 T 160 22 T 168 22 T 176 22 T 184 22 T 192 22 T 200 22 T 208 22 T 216 22 T 224 22 T 232 22 T 240 22 T 248 22 T 256 22 T 264 22 T 272 22 T 280 22 T 288 22 T 296 22 T 304 22 T 312 22 T 320 22 T 328 22 T 336 22" stroke="#F43F5E" stroke-width="2" fill="none"/>

    <text x="24" y="44" fill="#E11D48" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" letter-spacing="0.04em">
      OUR DIWALI SALE IS HERE: 20% OFF EVERYTHING.
    </text>

    <!-- Email Description & Verification Incentive -->
    <text x="24" y="66" fill="#64748B" font-family="Inter, sans-serif" font-size="11">
      Enjoy complimentary express delivery on prepaid orders.
    </text>

    <!-- SHOP NOW Action Pill Button -->
    <rect x="24" y="82" width="130" height="34" rx="17" fill="#0F172A"/>
    <text x="89" y="104" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">SHOP NOW →</text>
  </g>

  <!-- Bottom Operational Detection Banner (CommercePilot AI) -->
  <g transform="translate(0, 450)">
    <rect width="360" height="90" fill="#0D1117"/>
    <rect x="0" y="0" width="360" height="1" fill="#21262D"/>
    
    <polygon points="18,22 22,18 26,22 22,26" fill="#F43F5E"/>
    <text x="32" y="24" fill="#FDA4AF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="0.04em">
      1-CLICK VERIFICATION DISPATCHED: 42 CONFIRMED
    </text>
    <text x="18" y="44" fill="#8B949E" font-family="Inter, sans-serif" font-size="10.5">
      42 cash-on-delivery buyers pre-verified via secure email tokens.
    </text>
    <text x="18" y="60" fill="#8B949E" font-family="Inter, sans-serif" font-size="10.5">
      Zero RTO write-offs recorded on Diwali campaign batch.
    </text>
    <rect x="240" y="65" width="104" height="18" rx="9" fill="#161B22" stroke="#30363D"/>
    <text x="292" y="78" fill="#38BDF8" font-family="Inter, sans-serif" font-size="9" font-weight="600" text-anchor="middle">✓ RTO ELIMINATED</text>
  </g>
</svg>
