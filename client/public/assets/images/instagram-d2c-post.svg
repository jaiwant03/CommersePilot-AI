<svg width="360" height="540" viewBox="0 0 360 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient for Luxury Bottle -->
    <linearGradient id="marbleTable" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5EE"/>
      <stop offset="40%" stop-color="#F3EBE1"/>
      <stop offset="70%" stop-color="#EAE0D3"/>
      <stop offset="100%" stop-color="#DFD4C5"/>
    </linearGradient>
    <linearGradient id="sunGlow" x1="0%" y1="0%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#FFFDF7" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FDF3E3" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F4E6D2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="serumLiquid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD68A"/>
      <stop offset="50%" stop-color="#F6B850"/>
      <stop offset="100%" stop-color="#E29A26"/>
    </linearGradient>
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="90%" stop-color="#FFFFFF" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="dropperCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ECECEC"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCDCDC"/>
    </linearGradient>
  </defs>

  <!-- Outer Card Frame with Smooth Rounded Corners -->
  <rect width="360" height="540" rx="20" fill="#0D1117"/>
  <rect x="1" y="1" width="358" height="538" rx="19" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

  <!-- Top Window Chrome: INSTAGRAM POST -->
  <rect x="0" y="0" width="360" height="34" rx="20" fill="#161B22"/>
  <rect x="0" y="20" width="360" height="14" fill="#161B22"/>
  <text x="16" y="22" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="0.08em">INSTAGRAM POST</text>
  <circle cx="330" cy="18" r="3" fill="#484F58"/>
  <circle cx="342" cy="18" r="3" fill="#484F58"/>

  <!-- Instagram Header Bar Inside Post -->
  <rect x="0" y="34" width="360" height="46" fill="#FFFFFF"/>
  <circle cx="32" cy="57" r="14" fill="#F59E0B"/>
  <text x="32" y="62" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="12" font-weight="800" text-anchor="middle">A</text>
  <text x="54" y="54" fill="#0F172A" font-family="Inter, sans-serif" font-size="12" font-weight="700">aurelle.skin</text>
  <text x="54" y="67" fill="#64748B" font-family="Inter, sans-serif" font-size="10">Sponsored</text>
  <circle cx="336" cy="57" r="2" fill="#94A3B8"/>
  <circle cx="342" cy="57" r="2" fill="#94A3B8"/>
  <circle cx="348" cy="57" r="2" fill="#94A3B8"/>

  <!-- Main Image Scene: Luxury Skincare Bottle on Marble Tabletop -->
  <g transform="translate(0, 80)">
    <!-- Marble Surface Base -->
    <rect width="360" height="260" fill="url(#marbleTable)"/>
    
    <!-- Ambient Sunlight Rays and Caustics -->
    <path d="M0 0 L160 0 L240 260 L0 260 Z" fill="url(#sunGlow)"/>
    <ellipse cx="180" cy="235" rx="75" ry="18" fill="rgba(180, 150, 120, 0.35)"/>
    <ellipse cx="205" cy="240" rx="60" ry="12" fill="rgba(226, 154, 38, 0.25)"/>

    <!-- Water Ripple Reflections on Table -->
    <path d="M60 210 Q 120 205, 180 215 T 300 210" stroke="rgba(255, 255, 255, 0.6)" stroke-width="2" fill="none"/>
    <path d="M40 230 Q 140 225, 220 235 T 320 228" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.5" fill="none"/>

    <!-- Luxury Bottle Shadow -->
    <ellipse cx="180" cy="226" rx="42" ry="10" fill="rgba(100, 75, 50, 0.4)"/>

    <!-- Glass Dropper Bottle Body -->
    <rect x="145" y="70" width="70" height="150" rx="14" fill="#FFFFFF" fill-opacity="0.3"/>
    <rect x="148" y="73" width="64" height="144" rx="12" fill="url(#serumLiquid)"/>
    <!-- Glass Wall Thickness & Highlights -->
    <rect x="145" y="70" width="70" height="150" rx="14" fill="url(#glassReflection)" stroke="rgba(255, 255, 255, 0.7)" stroke-width="1.5"/>

    <!-- Bottle Neck -->
    <rect x="165" y="52" width="30" height="20" rx="3" fill="#FAF5EE" stroke="rgba(255, 255, 255, 0.8)"/>
    
    <!-- Golden Collar Ring -->
    <rect x="162" y="44" width="36" height="10" rx="2" fill="#D4AF37"/>
    <rect x="164" y="46" width="32" height="4" fill="#FFF2B2" opacity="0.8"/>

    <!-- White Rubber Bulb Dropper -->
    <path d="M167 44 C167 24, 193 24, 193 44 Z" fill="url(#dropperCap)"/>
    <ellipse cx="180" cy="44" rx="13" ry="3" fill="#D5D5D5"/>

    <!-- Inner Pipette Tube (Submerged in Serum) -->
    <rect x="177" y="55" width="6" height="150" rx="3" fill="rgba(255, 255, 255, 0.5)"/>

    <!-- Minimalist Luxury Product Label -->
    <rect x="156" y="112" width="48" height="74" rx="4" fill="#FFFDF8" stroke="rgba(212, 175, 55, 0.3)"/>
    <text x="180" y="132" fill="#1E293B" font-family="'Playfair Display', Georgia, serif" font-size="9" font-weight="800" text-anchor="middle" letter-spacing="0.04em">Aurelle</text>
    <text x="180" y="142" fill="#0F172A" font-family="'Playfair Display', Georgia, serif" font-size="9" font-weight="700" text-anchor="middle">Skin</text>
    <line x1="166" y1="148" x2="194" y2="148" stroke="#D4AF37" stroke-width="0.8"/>
    <text x="180" y="157" fill="#64748B" font-family="Inter, sans-serif" font-size="5.5" font-weight="600" text-anchor="middle" letter-spacing="0.06em">C-RADIANCE COMPLEX</text>
    <text x="180" y="166" fill="#0284C7" font-family="Inter, sans-serif" font-size="5" font-weight="700" text-anchor="middle">10% Active Vitamin C</text>
    <text x="180" y="177" fill="#94A3B8" font-family="Inter, sans-serif" font-size="4.5" text-anchor="middle">1 fl oz / 30 ml</text>
  </g>

  <!-- Instagram Post Interaction Bar -->
  <g transform="translate(0, 340)">
    <rect width="360" height="110" fill="#FFFFFF"/>
    <!-- Like, Comment, Send Icons -->
    <path d="M22 18 C18 13, 10 16, 10 22 C10 28, 22 36, 22 36 C22 36, 34 28, 34 22 C34 16, 26 13, 22 18 Z" fill="#EF4444"/>
    <path d="M48 20 C48 16, 62 16, 62 20 C62 25, 56 28, 52 30 L48 33 L49 28 C48 26, 48 23, 48 20 Z" fill="none" stroke="#0F172A" stroke-width="1.8"/>
    <path d="M78 18 L94 25 L86 28 L84 34 L78 18 Z" fill="none" stroke="#0F172A" stroke-width="1.8"/>
    <!-- Bookmark Icon -->
    <path d="M336 17 V35 L328 29 L320 35 V17 Z" fill="none" stroke="#0F172A" stroke-width="1.8"/>

    <!-- Post Caption -->
    <text x="16" y="52" fill="#0F172A" font-family="Inter, sans-serif" font-size="11" font-weight="700">aurelle.skin</text>
    <text x="82" y="52" fill="#334155" font-family="Inter, sans-serif" font-size="11">Meet the NEW Vitamin C serum!</text>
    <text x="16" y="68" fill="#475569" font-family="Inter, sans-serif" font-size="10.5">Clinically proven to fade dark spots &amp; boost glow.</text>
    
    <!-- Highlight Marker on Claims -->
    <rect x="16" y="74" width="138" height="14" rx="3" fill="#FEE2E2"/>
    <text x="19" y="85" fill="#DC2626" font-family="Inter, sans-serif" font-size="9" font-weight="700">Stock Buffer: 18 units reserved</text>
    <text x="160" y="85" fill="#64748B" font-family="Inter, sans-serif" font-size="9">COD Pre-Screen: Active</text>
  </g>

  <!-- Bottom Operational Detection Banner (CommercePilot AI) -->
  <g transform="translate(0, 450)">
    <rect width="360" height="90" fill="#0D1117"/>
    <rect x="0" y="0" width="360" height="1" fill="#21262D"/>
    
    <polygon points="18,22 22,18 26,22 22,26" fill="#F43F5E"/>
    <text x="32" y="24" fill="#FDA4AF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="0.04em">
      LIVE CATALOG SYNC: 18 UNITS RESERVED
    </text>
    <text x="18" y="44" fill="#8B949E" font-family="Inter, sans-serif" font-size="10.5" line-height="1.4">
      Safety buffer locked for Instagram D2C channel to
    </text>
    <text x="18" y="60" fill="#8B949E" font-family="Inter, sans-serif" font-size="10.5">
      prevent stockout cancellations (SKU-AUR-014).
    </text>
    <rect x="250" y="65" width="94" height="18" rx="9" fill="#161B22" stroke="#30363D"/>
    <text x="297" y="78" fill="#38BDF8" font-family="Inter, sans-serif" font-size="9" font-weight="600" text-anchor="middle">✓ ZERO OVERSELL</text>
  </g>
</svg>
