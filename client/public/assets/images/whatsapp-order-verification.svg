<svg width="360" height="540" viewBox="0 0 360 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- WhatsApp Background Patterns -->
    <linearGradient id="waHeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008069"/>
      <stop offset="100%" stop-color="#075E54"/>
    </linearGradient>
    <linearGradient id="waChatBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFEAE2"/>
      <stop offset="100%" stop-color="#E5DDD5"/>
    </linearGradient>
    <linearGradient id="sareeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>
    <linearGradient id="goldZari" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>

  <!-- Outer Card Frame with Smooth Rounded Corners -->
  <rect width="360" height="540" rx="20" fill="#0D1117"/>
  <rect x="1" y="1" width="358" height="538" rx="19" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

  <!-- Top Window Chrome: WHATSAPP INTERCEPT -->
  <rect x="0" y="0" width="360" height="34" rx="20" fill="#161B22"/>
  <rect x="0" y="20" width="360" height="14" fill="#161B22"/>
  <text x="16" y="22" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="0.08em">WHATSAPP INTERCEPT</text>
  <circle cx="330" cy="18" r="3" fill="#484F58"/>
  <circle cx="342" cy="18" r="3" fill="#484F58"/>

  <!-- WhatsApp Header Bar Inside App -->
  <rect x="0" y="34" width="360" height="52" fill="url(#waHeaderGrad)"/>
  <!-- WhatsApp Avatar -->
  <circle cx="30" cy="60" r="16" fill="#128C7E"/>
  <circle cx="30" cy="60" r="15" fill="#25D366"/>
  <text x="30" y="65" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="800" text-anchor="middle">⚡</text>
  <text x="56" y="55" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="13" font-weight="700">Chic Couture Verified</text>
  <text x="56" y="70" fill="#A7F3D0" font-family="Inter, sans-serif" font-size="10.5">Automated Pre-Dispatch Pilot</text>
  <circle cx="336" cy="60" r="2.5" fill="#FFFFFF"/>
  <circle cx="342" cy="60" r="2.5" fill="#FFFFFF"/>
  <circle cx="348" cy="60" r="2.5" fill="#FFFFFF"/>

  <!-- Chat Body Area -->
  <g transform="translate(0, 86)">
    <rect width="360" height="376" fill="url(#waChatBg)"/>
    
    <!-- Date Badge -->
    <rect x="135" y="10" width="90" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.85"/>
    <text x="180" y="24" fill="#64748B" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">TODAY 10:42 AM</text>

    <!-- Inbound Customer Message Bubble -->
    <g transform="translate(14, 38)">
      <rect width="332" height="250" rx="12" fill="#FFFFFF" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.06))"/>
      
      <!-- Verified Order Tag -->
      <rect x="14" y="12" width="130" height="20" rx="6" fill="#ECFDF5"/>
      <text x="22" y="26" fill="#059669" font-family="Inter, sans-serif" font-size="10" font-weight="700">✓ ORDER #ORD-6921</text>
      <text x="318" y="26" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10" text-anchor="end">10:42 AM</text>

      <!-- Message Text -->
      <text x="14" y="50" fill="#0F172A" font-family="Inter, sans-serif" font-size="12" font-weight="600">Hi Ananya, thank you for your order!</text>
      <text x="14" y="68" fill="#475569" font-family="Inter, sans-serif" font-size="11" line-height="1.4">
        Please confirm your Cash-on-Delivery address before our
      </text>
      <text x="14" y="84" fill="#475569" font-family="Inter, sans-serif" font-size="11">
        warehouse packages your items:
      </text>

      <!-- Product Thumbnail Preview Card inside WhatsApp -->
      <g transform="translate(14, 96)">
        <rect width="304" height="66" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <!-- Product Thumbnail Image -->
        <rect x="6" y="6" width="54" height="54" rx="6" fill="url(#sareeGrad)"/>
        <!-- Zari Pattern on saree -->
        <path d="M12 12 L54 54 M6 30 L36 60 M24 6 L60 42" stroke="url(#goldZari)" stroke-width="1.5" opacity="0.6"/>
        <text x="68" y="24" fill="#0F172A" font-family="Inter, sans-serif" font-size="11.5" font-weight="700">Chanderi Zari Silk Saree</text>
        <text x="68" y="40" fill="#64748B" font-family="Inter, sans-serif" font-size="10.5">Emerald Green • Royal Weave</text>
        <text x="68" y="55" fill="#0F172A" font-family="Inter, sans-serif" font-size="11" font-weight="800">₹3,499 (COD)</text>
      </g>

      <!-- 1-Click Interactive WhatsApp Buttons -->
      <g transform="translate(14, 172)">
        <!-- Confirm Button -->
        <rect width="304" height="32" rx="8" fill="#25D366"/>
        <text x="152" y="193" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">✓ Confirm Address &amp; Dispatch</text>
      </g>
      <g transform="translate(14, 210)">
        <!-- Convert to Prepaid Button -->
        <rect width="304" height="30" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
        <text x="152" y="230" fill="#0F172A" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">💳 Pay via UPI Now (Save ₹100 Extra)</text>
      </g>
    </g>

    <!-- Outbound Automated Confirmation Response -->
    <g transform="translate(68, 304)">
      <rect width="278" height="58" rx="10" fill="#D9FDD3" filter="drop-shadow(0 1px 3px rgba(0,0,0,0.06))"/>
      <text x="12" y="22" fill="#065F46" font-family="Inter, sans-serif" font-size="11" font-weight="700">✓ Address Confirmed by Buyer</text>
      <text x="12" y="38" fill="#1E293B" font-family="Inter, sans-serif" font-size="10.5">"Flat 402, Sea Green Apt, Bandra W, Mumbai"</text>
      <text x="264" y="50" fill="#059669" font-family="Inter, sans-serif" font-size="9" text-anchor="end">10:43 AM ✓✓</text>
    </g>
  </g>

  <!-- Bottom Operational Diagnosis Pill Bar (Matching Image 4 Style) -->
  <g transform="translate(0, 462)">
    <rect width="360" height="78" fill="#0D1117"/>
    <rect x="0" y="0" width="360" height="1" fill="rgba(255, 255, 255, 0.08)"/>
    <circle cx="20" cy="22" r="4" fill="#10B981"/>
    <text x="32" y="26" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">RTO RISK: 14/100 (LOW)</text>
    <text x="16" y="44" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="11" font-weight="600">
      Address confirmed via WhatsApp in 48s.
    </text>
    <text x="16" y="62" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10.5">
      Pre-dispatch RTO risk eliminated. Saved ₹340 in return logistics.
    </text>
  </g>
</svg>
