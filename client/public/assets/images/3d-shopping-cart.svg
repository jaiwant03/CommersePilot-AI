<svg width="220" height="190" viewBox="0 0 220 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft Floor Drop Shadows -->
    <radialGradient id="cartShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Metal Chrome Gradients -->
    <linearGradient id="chromeMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="30%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <linearGradient id="chromeWire" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Vibrant Purple Shopping Bag -->
    <linearGradient id="purpleBagFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="40%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>
    <linearGradient id="purpleBagSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#581C87"/>
    </linearGradient>

    <!-- Vibrant Cyan-Blue Shopping Bag -->
    <linearGradient id="blueBagFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="40%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="blueBagSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Bag Handles -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Ambient Floor Shadows -->
  <ellipse cx="110" cy="172" rx="95" ry="16" fill="url(#cartShadow)"/>
  <ellipse cx="65" cy="175" rx="14" ry="4" fill="rgba(15, 23, 42, 0.18)"/>
  <ellipse cx="155" cy="175" rx="14" ry="4" fill="rgba(15, 23, 42, 0.18)"/>

  <!-- Shopping Bags inside Cart (Placed before Front Wire Grid) -->
  <g id="shopping-bags">
    
    <!-- 1. Purple Shopping Bag (Left) -->
    <g transform="translate(42, 50)">
      <!-- Bag Handle Back -->
      <path d="M 22 18 C 22 2, 42 2, 42 18" stroke="url(#handleGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>
      
      <!-- Bag 3D Shape -->
      <!-- Side panel -->
      <polygon points="12,18 20,10 65,10 57,18" fill="url(#purpleBagSide)"/>
      <polygon points="57,18 65,10 65,75 57,85" fill="#581C87" opacity="0.6"/>
      <!-- Front panel -->
      <path d="M 12 18 L 57 18 L 57 85 L 12 85 Z" fill="url(#purpleBagFront)"/>
      
      <!-- Bag Top Crease & Shadow -->
      <line x1="12" y1="18" x2="57" y2="18" stroke="#F3E8FF" stroke-width="1.5" stroke-opacity="0.6"/>
      <!-- Bag Handle Front -->
      <path d="M 26 18 C 26 4, 38 4, 38 18" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- 2. Cyan-Blue Shopping Bag (Right, slightly behind purple bag) -->
    <g transform="translate(85, 42)">
      <!-- Handle Back -->
      <path d="M 25 20 C 25 4, 45 4, 45 20" stroke="url(#handleGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>
      
      <!-- Bag 3D Shape -->
      <polygon points="15,20 25,12 70,12 60,20" fill="url(#blueBagSide)"/>
      <polygon points="60,20 70,12 70,82 60,92" fill="#0369A1" opacity="0.6"/>
      <path d="M 15 20 L 60 20 L 60 92 L 15 92 Z" fill="url(#blueBagFront)"/>
      
      <line x1="15" y1="20" x2="60" y2="20" stroke="#CFFAFE" stroke-width="1.5" stroke-opacity="0.7"/>
      <!-- Handle Front -->
      <path d="M 30 20 C 30 6, 42 6, 42 20" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    </g>

  </g>

  <!-- Wire Shopping Cart Frame -->
  <g id="cart-basket">
    
    <!-- Basket Rim (Top Edge) -->
    <path d="M 28 85 L 168 76 L 162 142 L 38 145 Z" fill="rgba(255, 255, 255, 0.05)" stroke="url(#chromeMetal)" stroke-width="3.5" stroke-linejoin="round"/>
    
    <!-- Vertical Wire Bars -->
    <line x1="48" y1="84" x2="54" y2="144" stroke="url(#chromeWire)" stroke-width="2"/>
    <line x1="68" y1="83" x2="72" y2="144" stroke="url(#chromeWire)" stroke-width="2"/>
    <line x1="88" y1="82" x2="90" y2="143" stroke="url(#chromeWire)" stroke-width="2"/>
    <line x1="108" y1="80" x2="108" y2="143" stroke="url(#chromeWire)" stroke-width="2"/>
    <line x1="128" y1="79" x2="126" y2="143" stroke="url(#chromeWire)" stroke-width="2"/>
    <line x1="148" y1="78" x2="144" y2="142" stroke="url(#chromeWire)" stroke-width="2"/>

    <!-- Horizontal Wire Bars -->
    <path d="M 31 100 L 167 92" stroke="url(#chromeWire)" stroke-width="2"/>
    <path d="M 33 115 L 165 108" stroke="url(#chromeWire)" stroke-width="2"/>
    <path d="M 36 130 L 163 125" stroke="url(#chromeWire)" stroke-width="2"/>

    <!-- Handle Bar & Angled Supports -->
    <!-- Support Rod Left -->
    <path d="M 28 85 L 12 70" stroke="url(#chromeMetal)" stroke-width="4" stroke-linecap="round"/>
    <!-- Handle Grip (Cyan/White Glossy Grip) -->
    <path d="M 8 70 L 22 70" stroke="#38BDF8" stroke-width="7" stroke-linecap="round"/>

    <!-- Undercarriage Frame -->
    <path d="M 45 145 L 55 168 L 145 168 L 155 142" stroke="url(#chromeMetal)" stroke-width="4" stroke-linejoin="round" fill="none"/>
    <line x1="55" y1="168" x2="145" y2="168" stroke="#64748B" stroke-width="3"/>

    <!-- Wheels (Front & Back Pair) -->
    <!-- Back Left Wheel -->
    <circle cx="58" cy="172" r="7.5" fill="#475569" stroke="#E2E8F0" stroke-width="2.5"/>
    <circle cx="58" cy="172" r="2.5" fill="#94A3B8"/>
    
    <!-- Back Right Wheel -->
    <circle cx="78" cy="169" r="6" fill="#334155" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Front Left Wheel -->
    <circle cx="140" cy="172" r="7.5" fill="#475569" stroke="#E2E8F0" stroke-width="2.5"/>
    <circle cx="140" cy="172" r="2.5" fill="#94A3B8"/>

    <!-- Front Right Wheel -->
    <circle cx="156" cy="169" r="6" fill="#334155" stroke="#CBD5E1" stroke-width="2"/>
  </g>
</svg>
